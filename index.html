<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator Interface Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="shape2">
            0
        </div> 
        <div class="button-row">
            <div class="shape3">AC</div>
            <div class="shape4">00</div>
            <div class="shape5">%</div>
            <div class="shape6">÷</div>
        </div>
        <div class="button-row2">
            <div class="shape7">7</div>
            <div class="shape8">8</div>
            <div class="shape9">9</div>
            <div class="shape10">x</div>
        </div>
        <div class="button-row3">
            <div class="shape11">4</div>
            <div class="shape12">5</div>
            <div class="shape13">6</div>
            <div class="shape14">-</div>
        </div>
        <div class="button-row4">
            <div class="shape15">1</div>
            <div class="shape16">2</div>
            <div class="shape17">3</div>
            <div class="shape18">+</div>
        </div>
        <div class="button-row5">
            <div class="shape19">0</div>
            <div class="shape20">.</div>
            <div class="shape21">=</div>
        </div>
    </div>
</body>
</html>
